<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Kawaii Run 2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- start the big downloads right away, in parallel with game.js -->
<link rel="preload" as="fetch" crossorigin="anonymous" href="vec/scene.json">
<link rel="preload" as="fetch" crossorigin="anonymous" href="vec/atlas.json">
<link rel="preload" as="fetch" crossorigin="anonymous" href="vec/packs.json">
<link rel="preload" as="fetch" crossorigin="anonymous" href="assets/manifest.json">
<link rel="preload" as="fetch" crossorigin="anonymous" href="assets/hud.json">
<link rel="preload" as="fetch" crossorigin="anonymous" href="data/levels.json">
<link rel="preload" as="fetch" crossorigin="anonymous" href="data/player.json">
<!--atlas-preload-->
<link rel="preload" as="image" href="vec/atlas/a0.webp">
<link rel="preload" as="image" href="vec/atlas/a1.webp">
<!--/atlas-preload-->
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:auto}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#2b1d12;color:#dfbe99;font:700 28px/1.2 Arial,sans-serif;letter-spacing:1px;transition:opacity .4s;z-index:5}
#load .bar{margin-top:18px;width:220px;height:10px;border-radius:5px;background:#4a3320;overflow:hidden}
#load .bar i{display:block;height:100%;width:40%;border-radius:5px;background:#dfbe99;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}</style></head>
<body><div id="load">Kawairun 2<div class="bar"><i></i></div></div><canvas id="game" width="750" height="400"></canvas>
<script>
function fit(){var c=document.getElementById('game'),s=Math.min(innerWidth/750,innerHeight/400);c.style.width=750*s+'px';c.style.height=400*s+'px';}
addEventListener('resize',fit);fit();addEventListener('pointerdown',function(){window.focus()});
</script>
<script src="game.js"></script></body></html>
